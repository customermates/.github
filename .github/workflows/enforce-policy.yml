name: Repository policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  # The workflow guard reads review state, so a late approval has to re-evaluate the check instead
  # of leaving a stale failure. Like pull_request_target, this event runs the base-branch workflow
  # and never checks out pull-request code.
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: repository-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/repository-policy.yml
